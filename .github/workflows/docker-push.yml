name: Build, Push & Deploy RecipeHub App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DEVOPS_USERNAME }}   # Docker Hub username secret
          password: ${{ secrets.DEVOPS }}            # Docker Hub token secret

      # 3️⃣ Build & Push Backend Image
      - name: Build & Push Backend Image
        run: |
          docker build -t ${{ secrets.DEVOPS_USERNAME }}/recipehub-backend:latest ./backend
          docker push ${{ secrets.DEVOPS_USERNAME }}/recipehub-backend:latest

      # 4️⃣ Build & Push Frontend Image
      - name: Build & Push Frontend Image
        run: |
          docker build -t ${{ secrets.DEVOPS_USERNAME }}/recipehub-frontend:latest ./my-react-app
          docker push ${{ secrets.DEVOPS_USERNAME }}/recipehub-frontend:latest

      # 5️⃣ Deploy on EC2 via SSH
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}   # EC2 public IP secret
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}      # Paste .pem file in this secret
          script: |
            cd ~/recipehub
            docker-compose pull
            docker-compose down
            docker-compose up -d
