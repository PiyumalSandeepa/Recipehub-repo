name: Build, Push & Deploy RecipeHub App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DEVOPS }}

      # 3️⃣ Build & Push Backend Docker Image
      - name: Build & Push Backend Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/recipehub-backend:latest ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/recipehub-backend:latest

      # 4️⃣ Build & Push Frontend Docker Image
      - name: Build & Push Frontend Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/recipehub-frontend:latest ./my-react-app
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/recipehub-frontend:latest

      # 5️⃣ Deploy to EC2 via SSH
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3  # Updated to latest stable version
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            # Navigate to project directory (adjust path as needed)
            cd ~/recipehub || mkdir -p ~/recipehub && cd ~/recipehub
            
            # Pull latest docker-compose configuration
            # Option 1: If you have git repo on EC2
            # git pull origin main
            
            # Option 2: Download docker-compose.yml (if stored separately)
            # wget -O docker-compose.yml https://raw.githubusercontent.com/YOUR_USERNAME/YOUR_REPO/main/docker-compose.yml
            
            # Login to Docker Hub on EC2
            echo "${{ secrets.DEVOPS }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            
            # Pull latest images
            docker-compose pull
            
            # Stop and remove old containers
            docker-compose down
            
            # Start containers in detached mode
            docker-compose up -d
            
            # Clean up unused images
            docker image prune -f