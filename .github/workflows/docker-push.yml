name: Build, Push & Deploy RecipeHub App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps: 
      - name: Checkout source code
        uses: actions/checkout@v4
 
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
 
      - name: Build & Push Backend Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/recipehub-backend:latest ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/recipehub-backend:latest
 
      - name: Build & Push Frontend Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/recipehub-frontend:latest ./my-react-app
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/recipehub-frontend:latest
 
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/recipehub
            docker-compose pull
            docker-compose down
            docker-compose up -d
