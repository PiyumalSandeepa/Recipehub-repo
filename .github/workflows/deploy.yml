name: Build, Push & Deploy RecipeHub App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DEVOPS }}

      - name: Build & Push Backend Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/recipehub-backend:latest ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/recipehub-backend:latest

      - name: Build & Push Frontend Image
        run: |
          docker build \
            --build-arg REACT_APP_API_URL=http://${{ secrets.EC2_PUBLIC_IP }}:4000 \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/recipehub-frontend:latest \
            ./my-react-app
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/recipehub-frontend:latest

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            cd ~/recipehub

            echo "=== Logging into Docker Hub ==="
            echo "${{ secrets.DEVOPS }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "=== Freeing disk space (SAFE - database not affected) ==="
            docker image prune -af
            docker container prune -f
            docker builder prune -af

            echo "=== Pulling latest images ==="
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/recipehub-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/recipehub-frontend:latest

            echo "=== Restarting containers ==="
            docker-compose down
            docker-compose up -d

            echo "=== Waiting for services to start ==="
            sleep 15

            echo "=== Checking container status ==="
            docker-compose ps

            echo "=== Deployment completed successfully! ==="