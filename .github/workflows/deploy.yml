name: Build, Push & Deploy RecipeHub App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DEVOPS }}

      - name: Build & Push Backend Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/recipehub-backend:latest ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/recipehub-backend:latest

      - name: Build & Push Frontend Image
        run: |
          docker build \
            --build-arg REACT_APP_API_URL=http://${{ secrets.EC2_PUBLIC_IP }}:4000 \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/recipehub-frontend:latest \
            ./my-react-app
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/recipehub-frontend:latest

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_PUBLIC_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            cd ~/recipehub

            echo "=== Disk space BEFORE ==="
            df -h /

            echo "=== Logging into Docker Hub ==="
            echo "${{ secrets.DEVOPS }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            echo "=== Stopping containers ==="
            docker-compose down

            echo "=== Force removing old backend and frontend images ==="
            docker rmi -f ${{ secrets.DOCKERHUB_USERNAME }}/recipehub-backend:latest || true
            docker rmi -f ${{ secrets.DOCKERHUB_USERNAME }}/recipehub-frontend:latest || true

            echo "=== Cleaning unused images and cache ==="
            docker image prune -af
            docker container prune -f
            docker builder prune -af

            echo "=== Disk space AFTER cleanup ==="
            df -h /

            echo "=== Pulling FRESH backend image ==="
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/recipehub-backend:latest

            echo "=== Pulling FRESH frontend image ==="
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/recipehub-frontend:latest

            echo "=== Starting ALL containers ==="
            docker-compose up -d

            echo "=== Waiting for MySQL to be healthy ==="
            sleep 20

            echo "=== Container status ==="
            docker-compose ps

            echo "=== Disk space FINAL ==="
            df -h /

            echo "=== Deployment completed successfully! ==="